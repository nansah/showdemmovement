<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Showdem Movement</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0d1b3e;
  --pink:#EF7FBB;
  --blue:#57C8E9;
  --white:#fff;
  --bg:#f4f6fb;
  --border:#e2e6f0;
  --text:#1a2340;
  --muted:#6b7a9a;
  --radius:14px;
  --shadow:0 4px 24px rgba(13,27,62,.09);
}
html,body{height:100%;font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text)}

/* ══ LOGIN SCREEN ══ */
#loginScreen{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,var(--navy) 0%,#1e3a6e 100%);
}
.login-card{
  background:white;border-radius:24px;
  padding:2.8rem;width:min(400px,92vw);
  box-shadow:0 32px 80px rgba(0,0,0,.25);
  text-align:center;
}
.login-logo{
  font-family:'Fredoka One',sans-serif;
  font-size:1.9rem;color:var(--navy);
  margin-bottom:.25rem;
}
.login-logo span{color:var(--pink)}
.login-sub{font-size:.85rem;color:var(--muted);margin-bottom:2rem}
.login-input{
  width:100%;border:2px solid var(--border);border-radius:12px;
  padding:.75rem 1rem;font-size:1rem;font-family:'Nunito',sans-serif;
  text-align:center;letter-spacing:.04em;outline:none;
  transition:border-color .2s;margin-bottom:.75rem;
}
.login-input:focus{border-color:var(--pink)}
.login-error{
  color:#c0392b;font-size:.8rem;font-weight:700;
  margin-bottom:.6rem;min-height:1.2em;
}
.login-btn{
  width:100%;background:var(--pink);border:none;border-radius:12px;
  padding:.8rem;font-size:1rem;font-weight:800;font-family:'Nunito',sans-serif;
  color:white;cursor:pointer;transition:opacity .15s;
}
.login-btn:hover{opacity:.88}
.login-btn:disabled{opacity:.5;cursor:not-allowed}

/* ══ DASHBOARD ══ */
#dashboard{display:none}

.adm-header{
  position:sticky;top:0;z-index:100;
  background:var(--navy);border-bottom:3px solid var(--pink);
  padding:.9rem 2rem;
  display:flex;align-items:center;gap:1rem;
}
.adm-logo{
  font-family:'Fredoka One',sans-serif;
  font-size:1.2rem;color:white;flex:1;white-space:nowrap;
}
.adm-logo span{color:var(--pink)}
.adm-nav{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.adm-nav a,.adm-nav button{
  padding:.35rem .9rem;border-radius:8px;border:none;
  font-size:.78rem;font-weight:800;font-family:'Nunito',sans-serif;
  cursor:pointer;text-decoration:none;transition:opacity .15s;white-space:nowrap;
}
.adm-nav a,.adm-nav button:hover{opacity:.82}
.btn-preview{background:rgba(255,255,255,.1);color:white}
.btn-save{background:var(--pink);color:white}
.btn-backup{background:var(--blue);color:var(--navy)}
.btn-restore-wrap{position:relative;overflow:hidden}
.btn-restore{background:rgba(255,255,255,.08);color:rgba(255,255,255,.8)}
.restore-file-input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.btn-logout{background:transparent;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.15)!important}

.adm-main{
  max-width:900px;margin:0 auto;
  padding:2.5rem 1.5rem 5rem;
}
.adm-section-title{
  font-family:'Fredoka One',sans-serif;
  font-size:1.4rem;color:var(--navy);
  margin-bottom:1.5rem;display:flex;align-items:center;gap:.6rem;
}
.adm-section-title::after{
  content:'';flex:1;height:2px;
  background:linear-gradient(to right,var(--pink),transparent);
  border-radius:99px;
}

/* ══ CARD EDITORS ══ */
.card-editor{
  background:white;border-radius:var(--radius);
  border:2px solid var(--border);
  box-shadow:var(--shadow);
  margin-bottom:1.25rem;
  overflow:hidden;
  transition:border-color .2s;
}
.card-editor:focus-within{border-color:var(--pink)}

.card-editor-head{
  display:flex;align-items:center;gap:.9rem;
  padding:1rem 1.4rem;
  background:var(--bg);border-bottom:2px solid var(--border);
  cursor:pointer;user-select:none;
}
.card-num{
  width:28px;height:28px;border-radius:50%;
  background:var(--navy);color:white;
  font-size:.78rem;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.card-year{
  font-family:'Fredoka One',sans-serif;
  font-size:1rem;color:var(--navy);flex-shrink:0;
}
.card-section-name{font-size:.83rem;color:var(--muted);font-weight:700;flex:1}
.card-chevron{color:var(--muted);font-size:.9rem;transition:transform .2s}
.card-editor.open .card-chevron{transform:rotate(180deg)}

.card-editor-body{
  display:none;padding:1.4rem;
  display:flex;flex-direction:column;gap:1rem;
}
.card-editor:not(.open) .card-editor-body{display:none}
.card-editor.open .card-editor-body{display:flex}

.field-label{
  display:block;font-size:.72rem;font-weight:900;
  text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);margin-bottom:.35rem;
}
.field-input,.field-textarea{
  width:100%;border:2px solid var(--border);border-radius:10px;
  padding:.6rem .9rem;font-size:.9rem;font-family:'Nunito',sans-serif;
  color:var(--text);outline:none;transition:border-color .2s;resize:vertical;
}
.field-input:focus,.field-textarea:focus{border-color:var(--pink)}
.field-textarea{min-height:90px;line-height:1.6}

/* ── Media zone ── */
.media-zone{
  border:2px dashed var(--border);border-radius:12px;
  padding:1.2rem;transition:border-color .2s,background .2s;
}
.media-zone.has-media{border-style:solid;border-color:#c7d0e8}
.media-preview{
  border-radius:8px;overflow:hidden;
  margin-bottom:.75rem;line-height:0;
}
.media-preview img,.media-preview video{
  width:100%;border-radius:8px;display:block;max-height:220px;object-fit:cover;
}
.media-preview iframe{width:100%;aspect-ratio:16/9;border:none;border-radius:8px}
.media-preview iframe.tt-embed{aspect-ratio:9/16;max-width:190px;max-height:340px;margin:0 auto;display:block}
.media-preview blockquote.tt-embed{margin:0 auto}
.media-upload-row{display:flex;gap:.5rem;flex-wrap:wrap}
.media-btn{
  padding:.35rem .9rem;border-radius:8px;border:none;
  font-size:.76rem;font-weight:800;font-family:'Nunito',sans-serif;
  cursor:pointer;transition:opacity .15s;position:relative;overflow:hidden;
}
.media-btn-upload{background:var(--pink);color:white}
.media-btn-url{background:var(--blue);color:var(--navy)}
.media-btn-yt{background:var(--navy);color:white}
.media-btn-tt{background:#000;color:white}
.media-btn-clear{background:#f3f4f6;color:#888}
.media-file-input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.media-url-row{
  display:none;margin-top:.75rem;gap:.5rem;align-items:center;
}
.media-url-row.visible{display:flex}
.media-url-input{
  flex:1;border:2px solid var(--border);border-radius:8px;
  padding:.4rem .7rem;font-size:.82rem;font-family:'Nunito',sans-serif;
  outline:none;transition:border-color .2s;
}
.media-url-input:focus{border-color:var(--pink)}
.media-url-apply{
  background:var(--pink);color:white;border:none;
  border-radius:8px;padding:.4rem .85rem;
  font-size:.78rem;font-weight:800;font-family:'Nunito',sans-serif;
  cursor:pointer;
}
.media-uploading{
  font-size:.8rem;color:var(--muted);font-weight:700;
  padding:.4rem 0;
}

/* ══ TOAST ══ */
#adm-toast{
  position:fixed;bottom:2rem;left:50%;
  transform:translateX(-50%) translateY(140%);
  background:var(--navy);color:white;
  padding:.65rem 1.6rem;border-radius:999px;
  font-size:.84rem;font-weight:700;
  border:1px solid rgba(255,255,255,.12);
  z-index:9999;transition:transform .3s cubic-bezier(.22,1,.36,1);
  white-space:nowrap;pointer-events:none;
}
#adm-toast.visible{transform:translateX(-50%) translateY(0)}
#adm-toast.err{background:#b91c1c}

/* ══ PLACEHOLDER TOGGLE ══ */
.ph-toggle-row{
  display:flex;align-items:center;gap:.7rem;
  padding:.55rem .9rem;background:#f8f9fc;
  border-radius:8px;border:1px solid var(--border);
}
.ph-toggle-label{
  display:flex;align-items:center;gap:.55rem;
  font-size:.78rem;font-weight:700;color:var(--muted);cursor:pointer;
  user-select:none;
}
.ph-switch{position:relative;display:inline-block;width:34px;height:19px;flex-shrink:0}
.ph-switch input{opacity:0;width:0;height:0;position:absolute}
.ph-track{
  position:absolute;inset:0;border-radius:999px;
  background:#d1d5db;transition:background .2s;cursor:pointer;
}
.ph-switch input:checked + .ph-track{background:var(--pink)}
.ph-track::after{
  content:'';position:absolute;
  width:13px;height:13px;border-radius:50%;background:white;
  top:3px;left:3px;transition:transform .2s;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.ph-switch input:checked + .ph-track::after{transform:translateX(15px)}

/* ══ TAB BAR ══ */
.adm-tabs{display:flex;gap:.4rem;margin-bottom:2rem;border-bottom:2px solid var(--border);padding-bottom:0}
.adm-tab{background:none;border:none;cursor:pointer;font-family:'Fredoka One',sans-serif;font-size:.95rem;color:var(--muted);padding:.55rem 1.2rem;border-radius:8px 8px 0 0;border-bottom:3px solid transparent;margin-bottom:-2px;transition:color .2s,border-color .2s,background .2s}
.adm-tab:hover{color:var(--navy);background:var(--bg)}
.adm-tab.active{color:var(--pink);border-bottom-color:var(--pink);background:white}
/* ══ APPLICATIONS ══ */
#applicationsSection{display:none}
#waiversSection{display:none}
.apps-toolbar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:1.2rem}
.apps-filter{padding:.35rem .85rem;border:1.5px solid var(--border);border-radius:999px;font-family:'Nunito',sans-serif;font-size:.8rem;font-weight:700;background:white;color:var(--muted);cursor:pointer;transition:border-color .2s,color .2s}
.apps-filter.active,.apps-filter:hover{border-color:var(--pink);color:var(--pink)}
.apps-count{margin-left:auto;font-size:.78rem;font-weight:700;color:var(--muted)}
.apps-empty{text-align:center;padding:3rem 1rem;color:var(--muted);font-size:.9rem;font-weight:700}
.app-card{background:white;border-radius:14px;border:2px solid var(--border);margin-bottom:.75rem;overflow:hidden;transition:border-color .2s}
.app-card.status-approved{border-left:5px solid #16a34a}
.app-card.status-rejected{border-left:5px solid #dc2626}
.app-card.status-pending{border-left:5px solid #d97706}
.app-row{display:flex;align-items:center;gap:.9rem;padding:.9rem 1rem;cursor:pointer;user-select:none}
.app-avatar{width:40px;height:40px;border-radius:50%;flex-shrink:0;overflow:hidden;background:linear-gradient(135deg,var(--pink),var(--blue));display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:800;color:white}
.app-avatar img{width:100%;height:100%;object-fit:cover;object-position:top}
.app-meta{flex:1;min-width:0}
.app-name{font-weight:800;font-size:.88rem;color:var(--navy)}
.app-email{font-size:.76rem;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app-date{font-size:.73rem;color:var(--muted);font-weight:600;white-space:nowrap}
.status-badge{font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:.2rem .6rem;border-radius:999px;white-space:nowrap}
.status-badge.pending{background:#fef3c7;color:#92400e}
.status-badge.approved{background:#dcfce7;color:#166534}
.status-badge.rejected{background:#fee2e2;color:#991b1b}
.app-toggle{color:var(--muted);font-size:.75rem;margin-left:.25rem;transition:transform .25s;flex-shrink:0}
.app-card.open .app-toggle{transform:rotate(180deg)}
.app-detail{display:none;border-top:1px solid var(--border);padding:1.1rem}
.app-card.open .app-detail{display:block}
.app-photo-wrap{text-align:center;margin-bottom:1rem}
.app-photo-wrap img{width:80px;height:80px;border-radius:50%;object-fit:cover;object-position:top;border:3px solid var(--pink)}
.app-initials-lg{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--blue));display:inline-flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:800;color:white}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem .9rem;margin-bottom:1rem}
.detail-field label{display:block;font-size:.68rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.12rem}
.detail-field p{font-size:.83rem;font-weight:600;color:var(--navy);word-break:break-word;line-height:1.5}
.detail-field.full{grid-column:1/-1}
.detail-sep{font-size:.7rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:.85rem 0 .5rem;display:flex;align-items:center;gap:.4rem}
.detail-sep::after{content:'';flex:1;height:1px;background:var(--border)}
.app-status-row{display:flex;gap:.45rem;flex-wrap:wrap;margin:.8rem 0 .6rem}
.btn-status{padding:.38rem .95rem;border-radius:999px;border:2px solid transparent;cursor:pointer;font-family:'Nunito',sans-serif;font-size:.76rem;font-weight:800;transition:opacity .2s}
.btn-status:hover{opacity:.8}
.btn-status.approve{background:#dcfce7;color:#166534;border-color:#86efac}
.btn-status.reject{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
.btn-status.set-pending{background:#fef3c7;color:#92400e;border-color:#fde68a}
.btn-status.current{outline:2px solid currentColor;outline-offset:1px}
.notes-area{width:100%;padding:.6rem .8rem;border:1.5px solid var(--border);border-radius:8px;font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:600;resize:vertical;min-height:58px;transition:border-color .2s;outline:none}
.notes-area:focus{border-color:var(--pink)}
.app-actions-row{display:flex;gap:.5rem;margin-top:.55rem;flex-wrap:wrap}
.btn-save-notes{background:var(--navy);color:white;border:none;border-radius:8px;padding:.36rem .85rem;font-size:.76rem;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;transition:opacity .2s}
.btn-save-notes:hover{opacity:.8}
.btn-delete-app{background:none;border:1.5px solid #fca5a5;color:#dc2626;border-radius:8px;padding:.36rem .85rem;font-size:.76rem;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;transition:background .2s}
.btn-delete-app:hover{background:#fee2e2}
@media(max-width:600px){
  .adm-header{padding:.75rem 1rem;gap:.5rem}
  .adm-nav a,.adm-nav button{padding:.28rem .6rem;font-size:.72rem}
  .adm-main{padding:1.5rem 1rem 4rem}
  .detail-grid{grid-template-columns:1fr}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">Showdem <span>Movement</span></div>
    <p class="login-sub">Admin Panel</p>
    <input type="password" id="loginPass" class="login-input" placeholder="Enter password" autocomplete="current-password">
    <p class="login-error" id="loginError"></p>
    <button class="login-btn" id="loginBtn">Sign In</button>
  </div>
</div>

<!-- ═══ DASHBOARD ═══ -->
<div id="dashboard">
  <header class="adm-header">
    <div class="adm-logo">Showdem <span>Admin</span></div>
    <nav class="adm-nav">
      <a class="adm-nav btn-preview" href="/about.html" target="_blank">👁 Preview Site</a>
      <button class="adm-nav btn-save" id="saveAllBtn">💾 Save All</button>
      <button class="adm-nav btn-backup" id="backupBtn">📤 Backup</button>
      <span class="btn-restore-wrap">
        <button class="adm-nav btn-restore">📥 Restore</button>
        <input type="file" class="restore-file-input" id="restoreFile" accept="application/json">
      </span>
      <button class="adm-nav btn-logout" id="logoutBtn">Logout</button>
    </nav>
  </header>

  <main class="adm-main">
    <div class="adm-tabs">
      <button class="adm-tab active" id="tabTimeline" onclick="switchTab('timeline')">📋 Timeline Cards</button>
      <button class="adm-tab" id="tabApps" onclick="switchTab('applications')">👥 Applications <span id="pendingBadge" style="display:none;background:var(--pink);color:white;border-radius:999px;font-size:.65rem;padding:.1rem .45rem;margin-left:.3rem;vertical-align:middle"></span></button>
      <button class="adm-tab" id="tabWaivers" onclick="switchTab('waivers')">📝 Waivers</button>
    </div>

    <div id="timelineSection">
      <h2 class="adm-section-title">Founder Timeline Cards</h2>
      <div id="cardsContainer"></div>
      <button id="addCardBtn" style="margin-top:1.2rem;background:var(--navy);color:white;border:none;padding:.65rem 1.5rem;border-radius:10px;font-family:'Fredoka One',sans-serif;font-size:.95rem;cursor:pointer;display:flex;align-items:center;gap:.5rem">＋ Add New Card</button>
    </div>

    <div id="applicationsSection">
      <h2 class="adm-section-title">Member Applications</h2>
      <div class="apps-toolbar">
        <button class="apps-filter active" data-filter="all">All</button>
        <button class="apps-filter" data-filter="pending">Pending</button>
        <button class="apps-filter" data-filter="approved">Approved</button>
        <button class="apps-filter" data-filter="rejected">Rejected</button>
        <span class="apps-count" id="appsCount"></span>
      </div>
      <div id="appsList"></div>
    </div>

    <div id="waiversSection">
      <h2 class="adm-section-title">Participation Waivers</h2>
      <div class="apps-toolbar">
        <span class="apps-count" id="waiversCount"></span>
      </div>
      <div id="waiversList"></div>
    </div>
  </main>
</div>

<div id="adm-toast"></div>

<script>
(function () {
  /* ── Card metadata ── */
  var CARDS = [
    { id: 0, year: '2018',         label: 'The Beginning',          defaultEyebrow: 'The Beginning',              defaultTitle: 'Original Double Dutch Video',         defaultBody: 'In 2018, I recorded a video of myself jumping Double Dutch on July 4th. At the time, I had no idea this simple video would one day become the beginning of something much bigger.' },
    { id: 1, year: '2022',         label: 'A Step of Faith',        defaultEyebrow: 'A Step of Faith',            defaultTitle: 'Searching for Purpose',               defaultBody: 'After walking away from my six-figure business, I entered a season of searching for purpose — praying, fasting, and growing in my relationship with Jesus. I trusted that God was leading me somewhere greater.' },
    { id: 2, year: 'Jul 1, 2022',  label: 'It Went Viral',          defaultEyebrow: 'One Old Video. One New Beginning.', defaultTitle: 'It Went Viral',              defaultBody: 'On July 1, 2022, I reposted my old Double Dutch video. I thought I was sharing an old memory. Instead, it unexpectedly went viral and reached millions — and that single post became the spark that started the Showdem Movement.' },
    { id: 3, year: '2022',         label: 'Community Begins',       defaultEyebrow: 'Community Begins',           defaultTitle: 'The First Community Sessions',        defaultBody: 'Inspired by the response, I began hosting free community Double Dutch sessions. People from different ages, cultures, and backgrounds came together to jump, connect, and build community. This was the moment I knew Double Dutch could become much more.' },
    { id: 4, year: 'Times Square', label: 'The Movement Grew',      defaultEyebrow: 'The Movement Grew',          defaultTitle: 'Times Square — 42 Million Views',     defaultBody: 'We brought Double Dutch to Times Square. A Times Square session video went on to be viewed more than 42 million times, introducing people around the world to street-style Double Dutch.' },
    { id: 5, year: '2025',         label: 'A Real Community',       defaultEyebrow: 'More Than a Viral Moment',   defaultTitle: 'A Real Community',                    defaultBody: 'By 2025, Showdem had become much more than viral videos. People from different boroughs and cities gathered in Times Square to jump, connect, encourage one another, and celebrate street-style Double Dutch.' },
    { id: 6, year: '2025',         label: 'First Showdem Jump Off', defaultEyebrow: 'First Official Event',       defaultTitle: 'The First Showdem Jump Off',          defaultBody: 'People traveled from different boroughs and cities to compete, jump, connect, and celebrate the culture together. Borough vs. Borough. City vs. City. One Community.' }
  ];

  var TOKEN_KEY = 'showdem_admin_jwt';
  var pendingData = {};   // { cardId: { eyebrow, title, body, media } }

  /* ── Utilities ── */
  function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
  function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
  function clearToken() { localStorage.removeItem(TOKEN_KEY); }

  function authHeaders() {
    return { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' };
  }

  function showToast(msg, isErr) {
    var t = document.getElementById('adm-toast');
    t.textContent = msg;
    t.className = isErr ? 'err visible' : 'visible';
    clearTimeout(t._timer);
    t._timer = setTimeout(function () { t.classList.remove('visible'); }, 4000);
  }

  function getYouTubeEmbedUrl(url) {
    var m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([A-Za-z0-9_-]{11})/);
    return m ? 'https://www.youtube.com/embed/' + m[1] + '?rel=0' : null;
  }

  function getTikTokEmbedUrl(url) {
    var m = url.match(/tiktok\.com\/@[\w.-]+\/video\/(\d+)/);
    return m ? 'https://www.tiktok.com/embed/v2/' + m[1] : null;
  }

  /* ── Login ── */
  function tryLogin() {
    var pass = document.getElementById('loginPass').value.trim();
    var btn  = document.getElementById('loginBtn');
    var err  = document.getElementById('loginError');
    if (!pass) return;
    btn.disabled = true; btn.textContent = 'Signing in…';
    fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pass }) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
      .then(function (res) {
        if (res.ok) {
          setToken(res.data.token);
          showDashboard();
        } else {
          err.textContent = res.data.error || 'Incorrect password';
          btn.disabled = false; btn.textContent = 'Sign In';
          document.getElementById('loginPass').value = '';
        }
      })
      .catch(function () {
        err.textContent = 'Could not connect to server.';
        btn.disabled = false; btn.textContent = 'Sign In';
      });
  }

  document.getElementById('loginBtn').addEventListener('click', tryLogin);
  document.getElementById('loginPass').addEventListener('keydown', function (e) { if (e.key === 'Enter') tryLogin(); });

  /* ── Show dashboard ── */
  function showDashboard() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadContent();
  }

  /* ── Load content from server ── */
  function loadContent() {
    fetch('/api/content', { headers: { 'Authorization': 'Bearer ' + getToken() } })
      .then(function (r) {
        if (r.status === 401) { clearToken(); location.reload(); return null; }
        return r.json();
      })
      .then(function (data) {
        buildCardEditors(data || { text: {}, media: {} });
      })
      .catch(function () {
        buildCardEditors({ text: {}, media: {} });
      });
  }

  /* ── Build card editors ── */
  function buildCardEditors(savedData) {
    var container = document.getElementById('cardsContainer');
    container.innerHTML = '';
    var savedPlaceholders = savedData.placeholder || {};
    var savedYears        = savedData.years || {};

    // If server has a saved card list, use it to update CARDS order/years
    if (savedData.cards && savedData.cards.length) {
      CARDS = savedData.cards;
    }

    CARDS.forEach(function (card, idx) {
      var saved    = (savedData.text || {})[card.id] || {};
      var eyebrow  = saved.eyebrow || card.defaultEyebrow || card.label || '';
      var title    = saved.title   || card.defaultTitle   || '';
      var body     = saved.body    || card.defaultBody    || '';
      var year     = savedYears[card.id] !== undefined ? savedYears[card.id] : card.year;
      var mediaKey = 'card-' + card.id + '-0';
      var media    = (savedData.media || {})[mediaKey] || null;
      var showPh   = savedPlaceholders[card.id] !== false;

      pendingData[card.id] = { year: year, eyebrow: eyebrow, title: title, body: body, media: media, showPlaceholder: showPh };

      var el = document.createElement('div');
      el.className = 'card-editor';
      el.dataset.id = card.id;

      el.innerHTML = [
        '<div class="card-editor-head">',
          '<span class="card-num">' + (idx + 1) + '</span>',
          '<span class="card-year">' + esc(year) + '</span>',
          '<span class="card-section-name">' + esc(card.label || card.defaultEyebrow || '') + '</span>',
          '<span class="card-chevron">▼</span>',
        '</div>',
        '<div class="card-editor-body">',
          '<div>',
            '<label class="field-label">Year / Date</label>',
            '<input type="text" class="field-input f-year" value="' + esc(year) + '" placeholder="e.g. 2025 or Jul 1, 2022">',
          '</div>',
          '<div>',
            '<label class="field-label">Eyebrow Label</label>',
            '<input type="text" class="field-input f-eyebrow" value="' + esc(eyebrow) + '">',
          '</div>',
          '<div>',
            '<label class="field-label">Card Title</label>',
            '<input type="text" class="field-input f-title" value="' + esc(title) + '">',
          '</div>',
          '<div>',
            '<label class="field-label">Body Text</label>',
            '<textarea class="field-textarea f-body">' + escText(body) + '</textarea>',
          '</div>',
          '<div>',
            '<label class="field-label">Photo / Video</label>',
            '<div class="media-zone' + (media ? ' has-media' : '') + '">',
              '<div class="media-preview">' + renderMediaHTML(media) + '</div>',
              '<div class="media-upload-row">',
                '<span class="media-btn media-btn-upload"><input type="file" class="media-file-input" accept="image/*,video/mp4,video/webm,video/quicktime,.mov">📷 Upload Photo/Video</span>',
                '<button class="media-btn media-btn-url">🔗 Image URL</button>',
                '<button class="media-btn media-btn-yt">▶ YouTube</button>',
                '<button class="media-btn media-btn-tt">🎵 TikTok</button>',
                '<button class="media-btn media-btn-clear" style="' + (media ? '' : 'display:none') + '">✕ Clear</button>',
              '</div>',
              '<div class="media-url-row">',
                '<input type="url" class="media-url-input" placeholder="https://…">',
                '<button class="media-url-apply">Apply</button>',
              '</div>',
              '<div class="media-uploading" style="display:none">⏳ Uploading…</div>',
            '</div>',
          '</div>',
          '<div class="ph-toggle-row">',
            '<label class="ph-toggle-label">',
              '<span class="ph-switch">',
                '<input type="checkbox" class="f-show-ph"' + (showPh ? ' checked' : '') + '>',
                '<span class="ph-track"></span>',
              '</span>',
              'Show empty placeholder to visitors',
            '</label>',
          '</div>',
          '<div style="text-align:right;margin-top:1.2rem;padding-top:1rem;border-top:1px solid #edf0f7">',
            '<button class="card-del-btn" style="background:none;border:1px solid #e03;color:#e03;padding:.4rem 1.1rem;border-radius:8px;cursor:pointer;font-size:.82rem;font-family:inherit">🗑 Delete Card</button>',
          '</div>',
        '</div>'
      ].join('');

      container.appendChild(el);
      wireCardEditor(el, card.id);
    });

    var hasTikTok = CARDS.some(function (card) {
      var m = pendingData[card.id] && pendingData[card.id].media;
      return m && m.type === 'tiktok';
    });
    if (hasTikTok) loadTikTokEmbedScript();
  }

  function esc(s) { return (s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
  function escText(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

  function renderMediaHTML(media) {
    if (!media || !media.src) return '';
    if (media.type === 'image')      return '<img src="' + media.src + '" alt="">';
    if (media.type === 'video-file') return '<video src="' + media.src + '" controls></video>';
    if (media.type === 'youtube')    return '<iframe src="' + media.src + '" allowfullscreen title="Video"></iframe>';
    if (media.type === 'tiktok') {
      // A bare <iframe src="tiktok.com/embed/v2/ID"> isn't TikTok's documented
      // embed method and is unreliable (esp. on mobile) — use their official
      // blockquote + embed.js widget instead. We still store the embed/v2 URL
      // (existing saved cards already use it); just pull the id back out.
      var m = media.src.match(/(\d{6,})/);
      var videoId = m ? m[1] : '';
      return '<blockquote class="tiktok-embed tt-embed" cite="https://www.tiktok.com/video/' + videoId + '" data-video-id="' + videoId + '" style="max-width:190px;min-width:190px"><section></section></blockquote>';
    }
    return '';
  }

  function loadTikTokEmbedScript() {
    var s = document.createElement('script');
    s.src = 'https://www.tiktok.com/embed.js';
    s.async = true;
    document.body.appendChild(s);
  }

  /* ── Wire a card editor's interactivity ── */
  function wireCardEditor(el, cardId) {
    /* Accordion toggle */
    el.querySelector('.card-editor-head').addEventListener('click', function () {
      el.classList.toggle('open');
    });

    /* Text field changes */
    el.querySelector('.f-year').addEventListener('input', function () {
      pendingData[cardId].year = this.value;
      var card = CARDS.find(function(c) { return c.id === cardId; });
      if (card) {
        card.year = this.value;
        el.querySelector('.card-year').textContent = this.value;
      }
    });
    el.querySelector('.f-eyebrow').addEventListener('input', function () { pendingData[cardId].eyebrow = this.value; });
    el.querySelector('.f-title').addEventListener('input', function () { pendingData[cardId].title = this.value; });
    el.querySelector('.f-body').addEventListener('input', function () { pendingData[cardId].body = this.value; });

    /* Placeholder toggle */
    el.querySelector('.f-show-ph').addEventListener('change', function () { pendingData[cardId].showPlaceholder = this.checked; });

    /* Delete card */
    el.querySelector('.card-del-btn').addEventListener('click', function () {
      if (!confirm('Delete this card? This cannot be undone until you save.')) return;
      CARDS = CARDS.filter(function(c) { return c.id !== cardId; });
      delete pendingData[cardId];
      el.remove();
      // re-number the counters
      var all = document.querySelectorAll('.card-editor');
      all.forEach(function(e, i) { var n = e.querySelector('.card-num'); if (n) n.textContent = i + 1; });
    });

    var zone       = el.querySelector('.media-zone');
    var previewEl  = el.querySelector('.media-preview');
    var clearBtn   = el.querySelector('.media-btn-clear');
    var urlBtn     = el.querySelector('.media-btn-url');
    var ytBtn      = el.querySelector('.media-btn-yt');
    var ttBtn      = el.querySelector('.media-btn-tt');
    var urlRow     = el.querySelector('.media-url-row');
    var urlInput   = el.querySelector('.media-url-input');
    var urlApply   = el.querySelector('.media-url-apply');
    var uploadEl   = el.querySelector('.media-file-input');
    var loadingEl  = el.querySelector('.media-uploading');

    function setMedia(media) {
      pendingData[cardId].media = media;
      previewEl.innerHTML = renderMediaHTML(media);
      zone.classList.toggle('has-media', !!media);
      clearBtn.style.display = media ? '' : 'none';
      if (media && media.type === 'tiktok') loadTikTokEmbedScript();
    }

    /* File upload — get a signed Supabase Storage URL from our API, then
       upload the file straight to Supabase from the browser. Routing large
       video files through our own serverless function would hit Vercel's
       request body size limit. */
    uploadEl.addEventListener('change', function () {
      var file = this.files[0];
      if (!file) return;
      loadingEl.style.display = 'block';
      var isVideo = file.type.indexOf('video') === 0;

      fetch('/api/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
        body: JSON.stringify({ filename: file.name })
      })
        .then(function (r) {
          if (r.status === 401) { clearToken(); location.reload(); }
          return r.json();
        })
        .then(function (meta) {
          if (!meta.signedUrl) throw new Error(meta.error || 'Could not prepare upload');
          var supa = window.supabase.createClient(meta.supabaseUrl, meta.supabaseAnonKey);
          return supa.storage.from('media')
            .uploadToSignedUrl(meta.path, meta.token, file, { contentType: file.type })
            .then(function (result) {
              if (result.error) throw new Error(result.error.message);
              loadingEl.style.display = 'none';
              setMedia({ type: isVideo ? 'video-file' : 'image', src: meta.url });
            });
        })
        .catch(function (e) {
          loadingEl.style.display = 'none';
          showToast('Upload error: ' + e.message, true);
        });
    });

    /* URL / YouTube buttons toggle URL row */
    var urlMode = null;
    function showUrlRow(mode) {
      urlMode = mode;
      urlRow.classList.add('visible');
      urlInput.placeholder = mode === 'youtube' ? 'https://www.youtube.com/watch?v=…' :
                              mode === 'tiktok'  ? 'https://www.tiktok.com/@user/video/…' :
                              'https://example.com/photo.jpg';
      urlInput.value = '';
      urlInput.focus();
    }
    urlBtn.addEventListener('click', function () { showUrlRow('url'); });
    ytBtn.addEventListener('click',  function () { showUrlRow('youtube'); });
    ttBtn.addEventListener('click',  function () { showUrlRow('tiktok'); });

    urlApply.addEventListener('click', function () {
      var val = urlInput.value.trim();
      if (!val) return;
      if (urlMode === 'youtube') {
        var embed = getYouTubeEmbedUrl(val);
        if (!embed) { showToast('Not a valid YouTube URL', true); return; }
        setMedia({ type: 'youtube', src: embed });
      } else if (urlMode === 'tiktok') {
        var ttEmbed = getTikTokEmbedUrl(val);
        if (!ttEmbed) { showToast('Not a valid TikTok video URL', true); return; }
        setMedia({ type: 'tiktok', src: ttEmbed });
      } else {
        setMedia({ type: 'image', src: val });
      }
      urlRow.classList.remove('visible');
      urlInput.value = '';
    });

    urlInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') urlApply.click(); });

    /* Clear media */
    clearBtn.addEventListener('click', function () { setMedia(null); });
  }

  /* ── Save all ── */
  function saveAll() {
    var btn = document.getElementById('saveAllBtn');
    btn.disabled = true; btn.textContent = '⏳ Saving…';

    var text        = {};
    var media       = {};
    var placeholder = {};
    var years       = {};

    Object.keys(pendingData).forEach(function (id) {
      var d = pendingData[id];
      text[id]        = { eyebrow: d.eyebrow, title: d.title, body: d.body };
      years[id]       = d.year;
      if (d.media) media['card-' + id + '-0'] = d.media;
      placeholder[id] = d.showPlaceholder !== false;
    });

    // Save the current card list (preserves add/delete/order)
    var savedCards = CARDS.map(function(c) {
      return { id: c.id, year: pendingData[c.id] ? pendingData[c.id].year : c.year, label: c.label || c.defaultEyebrow || '', defaultEyebrow: c.defaultEyebrow, defaultTitle: c.defaultTitle, defaultBody: c.defaultBody };
    });

    fetch('/api/content', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ cards: savedCards, text: text, media: media, placeholder: placeholder, years: years })
    })
    .then(function (r) {
      if (r.status === 401) { clearToken(); location.reload(); return; }
      btn.disabled = false; btn.textContent = '💾 Save All';
      return r.json().then(function(d) {
        if (r.ok) { showToast('Saved! All visitors will see the updates.'); }
        else { showToast('Save failed: ' + (d.error || r.status), true); }
      });
    })
    .catch(function (e) {
      btn.disabled = false; btn.textContent = '💾 Save All';
      showToast('Network error: ' + e.message, true);
    });
  }

  /* ── Backup / Restore ── */
  document.getElementById('backupBtn').addEventListener('click', function () {

          else showToast('Restore failed', true);
        });

  });

  /* ══════════════════════════════════════════
     APPLICATIONS TAB
  ══════════════════════════════════════════ */
  var allApps = [];
  var activeFilter = 'all';

  function switchTab(tab) {
    document.getElementById('timelineSection').style.display     = tab === 'timeline'     ? 'block' : 'none';
    document.getElementById('applicationsSection').style.display = tab === 'applications' ? 'block' : 'none';
    document.getElementById('waiversSection').style.display      = tab === 'waivers'      ? 'block' : 'none';
    document.getElementById('tabTimeline').classList.toggle('active', tab === 'timeline');
    document.getElementById('tabApps').classList.toggle('active', tab === 'applications');
    document.getElementById('tabWaivers').classList.toggle('active', tab === 'waivers');
    if (tab === 'applications') loadApplications();
    if (tab === 'waivers') loadWaivers();
  }

  function loadApplications() {
    fetch('/api/applications', { headers: authHeaders() })
      .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function(apps) {
        allApps = apps;
        updatePendingBadge();
        renderApplications();
      })
      .catch(function() { document.getElementById('appsList').innerHTML = '<p class="apps-empty">Could not load applications.</p>'; });
  }

  function updatePendingBadge() {
    var pending = allApps.filter(function(a) { return a.status === 'pending'; }).length;
    var badge = document.getElementById('pendingBadge');
    if (pending > 0) { badge.style.display = ''; badge.textContent = pending; }
    else { badge.style.display = 'none'; }
  }

  function renderApplications() {
    var filtered = activeFilter === 'all' ? allApps : allApps.filter(function(a) { return a.status === activeFilter; });
    document.getElementById('appsCount').textContent = filtered.length + ' application' + (filtered.length === 1 ? '' : 's');
    if (!filtered.length) {
      document.getElementById('appsList').innerHTML = '<p class="apps-empty">No ' + (activeFilter === 'all' ? '' : activeFilter + ' ') + 'applications yet.</p>';
      return;
    }
    document.getElementById('appsList').innerHTML = filtered.map(function(app) {
      return buildAppCard(app);
    }).join('');
    // bind events
    document.querySelectorAll('.app-row').forEach(function(row) {
      row.addEventListener('click', function() {
        var card = this.closest('.app-card');
        card.classList.toggle('open');
      });
    });
    document.querySelectorAll('.btn-status').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var id = this.dataset.id, status = this.dataset.status;
        updateAppStatus(id, status);
      });
    });
    document.querySelectorAll('.btn-save-notes').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var id = this.dataset.id;
        var notes = document.querySelector('.notes-area[data-id="' + id + '"]').value;
        saveAppNotes(id, notes);
      });
    });
    document.querySelectorAll('.btn-delete-app').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (!confirm('Delete this application? This cannot be undone.')) return;
        deleteApp(this.dataset.id);
      });
    });
  }

  function buildAppCard(app) {
    var d    = app.data || {};
    var name = (d.first_name || '') + ' ' + (d.last_name || '');
    var initials = ((d.first_name || '?')[0] + (d.last_name || '?')[0]).toUpperCase();
    var date = app.submittedAt ? new Date(app.submittedAt).toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'}) : '';
    var avatarHtml = d.photo_url
      ? '<div class="app-avatar"><img src="' + d.photo_url + '" alt=""></div>'
      : '<div class="app-avatar">' + initials + '</div>';
    var badgeCls = app.status || 'pending';
    var checks = [
      ['ack_guide','Read Official Membership Guide'],['ack_standards','Agreed to Community Standards'],
      ['ack_brand','Agreed to Brand Policy'],['ack_tshirt','T-Shirt Purchase Confirmed'],
      ['ack_volunteer','Volunteer Terms Understood'],['media_release','Media Release Signed'],
      ['liability_waiver','Liability Waiver Signed']
    ];
    var acksHtml = checks.map(function(c) {
      var val = d[c[0]];
      var ok  = val === 'on' || val === 'true' || val === true;
      return '<span style="font-size:.78rem;font-weight:700;color:' + (ok ? '#166534' : '#991b1b') + '">' + (ok ? '✓' : '✗') + ' ' + c[1] + '</span>';
    }).join('<br>');

    return '<div class="app-card status-' + badgeCls + '" data-id="' + app.id + '">' +
      '<div class="app-row">' +
        avatarHtml +
        '<div class="app-meta"><div class="app-name">' + (name.trim() || 'Unknown') + '</div>' +
        '<div class="app-email">' + (d.email || '') + '</div></div>' +
        '<div class="app-date">' + date + '</div>' +
        '<span class="status-badge ' + badgeCls + '">' + badgeCls + '</span>' +
        '<span class="app-toggle">▾</span>' +
      '</div>' +
      '<div class="app-detail">' +
        (d.photo_url ? '<div class="app-photo-wrap"><img src="' + d.photo_url + '" alt="Applicant photo"></div>' : '<div class="app-photo-wrap"><div class="app-initials-lg">' + initials + '</div></div>') +
        '<div class="detail-sep">Personal Info</div>' +
        '<div class="detail-grid">' +
          field('Full Name', name.trim()) +
          field('Email', d.email) +
          field('Phone', d.phone) +
          field('Date of Birth', d.date_of_birth) +
          field('Address', d.address, true) +
        '</div>' +
        '<div class="detail-sep">Emergency Contact</div>' +
        '<div class="detail-grid">' +
          field('Name', d.emergency_contact_name) +
          field('Phone', d.emergency_contact_phone) +
          field('Relationship', d.emergency_contact_relationship) +
        '</div>' +
        (d.allergies || d.medical_conditions || d.medications ? '<div class="detail-sep">Medical Info</div><div class="detail-grid">' + field('Allergies', d.allergies) + field('Conditions', d.medical_conditions) + field('Medications', d.medications) + '</div>' : '') +
        '<div class="detail-sep">About the Applicant</div>' +
        '<div class="detail-grid">' +
          field('Why Join', d.why_join, true) +
          field('Attended Session?', d.attended_session) +
          field('DD Experience', d.double_dutch_experience, true) +
          field('Skills / Talents', d.skills_talents, true) +
        '</div>' +
        '<div class="detail-sep">Agreements</div>' +
        '<div style="margin-bottom:.9rem;display:flex;flex-direction:column;gap:.2rem">' + acksHtml + '</div>' +
        '<div class="detail-sep">Digital Signature</div>' +
        '<div class="detail-grid">' +
          field('Signed As', d.digital_signature, false, 'font-style:italic;font-size:1rem') +
          field('Signature Date', d.signature_date) +
        '</div>' +
        '<div class="detail-sep">Status</div>' +
        '<div class="app-status-row">' +
          '<button class="btn-status approve' + (app.status==='approved'?' current':'') + '" data-id="' + app.id + '" data-status="approved">✓ Approve</button>' +
          '<button class="btn-status set-pending' + (app.status==='pending'?' current':'') + '" data-id="' + app.id + '" data-status="pending">◷ Pending</button>' +
          '<button class="btn-status reject' + (app.status==='rejected'?' current':'') + '" data-id="' + app.id + '" data-status="rejected">✗ Reject</button>' +
        '</div>' +
        '<div class="detail-sep">Admin Notes</div>' +
        '<textarea class="notes-area" data-id="' + app.id + '" placeholder="Add internal notes…">' + (app.notes || '') + '</textarea>' +
        '<div class="app-actions-row">' +
          '<button class="btn-save-notes" data-id="' + app.id + '">Save Notes</button>' +
          '<button class="btn-delete-app" data-id="' + app.id + '">Delete Application</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function field(label, val, full, style) {
    if (!val) return '';
    return '<div class="detail-field' + (full ? ' full' : '') + '"><label>' + label + '</label><p' + (style ? ' style="' + style + '"' : '') + '>' + val + '</p></div>';
  }

  function updateAppStatus(id, status) {
    fetch('/api/applications', { method: 'PATCH', headers: Object.assign({'Content-Type':'application/json'}, authHeaders()), body: JSON.stringify({id:id, status:status}) })
      .then(function(r) { if(r.ok) { loadApplications(); showToast('Status updated to ' + status); } else showToast('Update failed', true); });
  }

  function saveAppNotes(id, notes) {
    fetch('/api/applications', { method: 'PATCH', headers: Object.assign({'Content-Type':'application/json'}, authHeaders()), body: JSON.stringify({id:id, notes:notes}) })
      .then(function(r) { if(r.ok) showToast('Notes saved'); else showToast('Save failed', true); });
  }

  function deleteApp(id) {
    fetch('/api/applications', { method: 'DELETE', headers: Object.assign({'Content-Type':'application/json'}, authHeaders()), body: JSON.stringify({id:id}) })
      .then(function(r) { if(r.ok) { loadApplications(); showToast('Application deleted'); } else showToast('Delete failed', true); });
  }

  // Filter buttons
  document.querySelectorAll('.apps-filter').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.apps-filter').forEach(function(b) { b.classList.remove('active'); });
      this.classList.add('active');
      activeFilter = this.dataset.filter;
      renderApplications();
    });
  });

  /* ══════════════════════════════════════════
     WAIVERS TAB
  ══════════════════════════════════════════ */
  var allWaivers = [];

  function loadWaivers() {
    fetch('/api/waiver', { headers: authHeaders() })
      .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function(waivers) {
        allWaivers = waivers;
        renderWaivers();
      })
      .catch(function() { document.getElementById('waiversList').innerHTML = '<p class="apps-empty">Could not load waivers.</p>'; });
  }

  function renderWaivers() {
    document.getElementById('waiversCount').textContent = allWaivers.length + ' waiver' + (allWaivers.length === 1 ? '' : 's');
    if (!allWaivers.length) {
      document.getElementById('waiversList').innerHTML = '<p class="apps-empty">No waivers submitted yet.</p>';
      return;
    }
    document.getElementById('waiversList').innerHTML = allWaivers.map(buildWaiverCard).join('');
    document.querySelectorAll('.waiver-row').forEach(function(row) {
      row.addEventListener('click', function() {
        this.closest('.app-card').classList.toggle('open');
      });
    });
    document.querySelectorAll('.btn-delete-waiver').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (!confirm('Delete this waiver? This cannot be undone.')) return;
        deleteWaiver(this.dataset.id);
      });
    });
  }

  function buildWaiverCard(w) {
    var d = w.data || {};
    var initials = (d.fullName || '?').trim().split(/\s+/).map(function(s){return s[0];}).slice(0,2).join('').toUpperCase();
    var date = w.submittedAt ? new Date(w.submittedAt).toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'}) : '';
    var conduct = d.conduct || {}, media = d.media || {}, resp = d.responsibility || {};
    var checks = [
      [conduct.respect, 'Agreed to treat everyone with respect'],
      [conduct.removal, 'Understands disruptive behavior may result in removal'],
      [conduct.instructions, 'Agrees to follow leadership instructions'],
      [d.safety, 'Agreed to health & safety guidelines'],
      [media.permission, 'Gave media/photo permission'],
      [media.usage, 'Understands media usage terms'],
      [media.noCompensation, 'Understands no compensation for media'],
      [d.visibility, 'Acknowledged media visibility policy'],
      [d.liability, 'Agreed to liability waiver'],
      [resp.voluntary, 'Participates voluntarily'],
      [resp.ownHealth, 'Responsible for own health'],
      [resp.mayBeAskedToLeave, 'Understands may be asked to leave'],
      [d.sigConsent, 'Confirmed & signed agreement']
    ];
    var checksHtml = checks.map(function(c) {
      return '<span style="font-size:.78rem;font-weight:700;color:' + (c[0] ? '#166534' : '#991b1b') + '">' + (c[0] ? '✓' : '✗') + ' ' + c[1] + '</span>';
    }).join('<br>');

    return '<div class="app-card" data-id="' + w.id + '">' +
      '<div class="app-row waiver-row">' +
        '<div class="app-avatar">' + initials + '</div>' +
        '<div class="app-meta"><div class="app-name">' + (d.fullName || 'Unknown') + '</div>' +
        '<div class="app-email">' + (d.email || '') + '</div></div>' +
        '<div class="app-date">' + date + '</div>' +
        (d.isMinor ? '<span class="status-badge pending">minor</span>' : '') +
        '<span class="app-toggle">▾</span>' +
      '</div>' +
      '<div class="app-detail">' +
        '<div class="detail-sep">Participant Info</div>' +
        '<div class="detail-grid">' +
          field('Full Name', d.fullName) +
          field('Email', d.email) +
          field('Phone', d.phone) +
          field('Social', d.social) +
          field('Emergency Contact', d.emergency) +
        '</div>' +
        (d.isMinor ? '<div class="detail-sep">Minor</div><div class="detail-grid">' + field('Parent/Guardian', d.guardianName) + '</div>' : '') +
        '<div class="detail-sep">Agreements</div>' +
        '<div style="margin-bottom:.9rem;display:flex;flex-direction:column;gap:.2rem">' + checksHtml + '</div>' +
        (resp.other ? '<div class="detail-sep">Additional Notes</div><div class="detail-grid">' + field('Notes', resp.other, true) + '</div>' : '') +
        '<div class="detail-sep">Digital Signature</div>' +
        '<div class="detail-grid">' +
          field('Signed As', d.signature, false, 'font-style:italic;font-size:1rem') +
          field('Signature Date', d.sigDate) +
        '</div>' +
        '<div class="app-actions-row">' +
          '<button class="btn-delete-app btn-delete-waiver" data-id="' + w.id + '">Delete Waiver</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function deleteWaiver(id) {
    fetch('/api/waiver', { method: 'DELETE', headers: Object.assign({'Content-Type':'application/json'}, authHeaders()), body: JSON.stringify({id:id}) })
      .then(function(r) { if(r.ok) { loadWaivers(); showToast('Waiver deleted'); } else showToast('Delete failed', true); });
  }

  /* ── Auto-login if token already stored ── */
  if (getToken()) {
    showDashboard();
  }

  window.switchTab = switchTab;

})();
</script>
</body>
</html>
